name: Build work pages

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"
  push:
    paths:
      - "scripts/build_works.py"
      - ".github/workflows/build-works.yml"

permissions:
  contents: write

concurrency:
  group: build-works
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==13.0.0
      - run: python scripts/build_works.py
      - name: Commit generated files
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A img originals work works.json sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update work pages and optimised images from the sheet"
            git push
          fi
