<!DOCTYPE html>
<html :lang="lang" :dir="lang === 'ar' ? 'rtl' : 'ltr'" x-data="osmanArt()" x-init="init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osman Rafaat | Visual Artist</title>
    <meta name="description" content="Paintings and drawings by Osman Rafaat, a visual artist from Minya, Egypt. Browse the works and ask about availability.">
    <meta property="og:title" content="Osman Rafaat | Visual Artist">
    <meta property="og:description" content="Paintings and drawings by Osman Rafaat. Browse the works and contact the artist.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://osmanrafaat.github.io/osman-fine-art/">
    <meta property="og:image" content="https://osmanrafaat.github.io/osman-fine-art/art/24-another-world.jpg">
    <meta name="twitter:card" content="summary_large_image">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-57P5FH8434"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-57P5FH8434');
</script>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'art-bg': '#f5f2eb',
                        'art-ink': '#1c1a17',
                        'art-accent': '#8b7355',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        [x-cloak] { display: none !important; }
        
        html { scroll-behavior: smooth; }
        body { background-color: #f5f2eb; color: #1c1a17; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .serif-italic { font-family: 'Cormorant Garamond', serif; font-style: italic; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .modal-backdrop { backdrop-filter: blur(12px); background-color: rgba(28, 26, 23, 0.85); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f5f2eb; }
        ::-webkit-scrollbar-thumb { background: #8b7355; }

        .artwork-image-container img { transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .artwork-image-container:hover img { transform: scale(1.05); }

        [dir="rtl"] .modal-row-label { border-right: 2px solid #8b7355; padding-right: 1rem; border-left: 0; padding-left: 0; }
        [dir="ltr"] .modal-row-label { border-left: 2px solid #8b7355; padding-left: 1rem; border-right: 0; padding-right: 0; }
        
        [dir="rtl"] body, [dir="rtl"] .serif-italic { font-family: 'Noto Sans Arabic', sans-serif; font-style: normal; }
        [dir="rtl"] [class*="tracking-"] { letter-spacing: normal; }
        [dir="rtl"] nav a, [dir="rtl"] nav button { font-size: 12px; }
        [dir="rtl"] h1 { line-height: 1.5; }
        [dir="rtl"] h3 { line-height: 1.7; }
        .site-logo { filter: none !important; opacity: 1 !important; transform: none !important; }

        /* ===== New Hero (Museum-style split layout) ===== */
        .hero-split { min-height: 92vh; }
        .hero-frame {
            position: relative;
            background: #ffffff;
            box-shadow: 0 30px 70px -20px rgba(28,26,23,0.35);
        }
        .hero-frame::before{
            content:'';
            position:absolute;
            inset: 14px;
            border: 1px solid rgba(28,26,23,0.08);
            pointer-events: none;
        }
        .hero-eyebrow-line{
            display:flex; align-items:center; gap:14px;
        }
        .hero-eyebrow-line::before{
            content:'';
            width: 36px; height: 1px;
            background: #8b7355;
        }
        [dir="rtl"] .hero-eyebrow-line::before{ order: 2; }
    </style>
</head>
<body class="antialiased">

    <!-- NAVIGATION -->
    <nav class="fixed top-0 left-0 w-full h-24 z-50 flex items-center justify-between px-6 md:px-16 bg-art-bg/90 backdrop-blur-sm border-b border-art-ink/5">
        <a href="#" @click.prevent="window.scrollTo(0, 0)" class="h-14">
            <img src="art/21-logo.jpg" alt="Logo" class="h-full w-auto rounded-full site-logo shadow-sm border border-art-ink/10">
        </a>
        
        <div class="hidden md:flex gap-12 items-center">
            <div class="flex gap-12 text-[10px] uppercase font-bold tracking-[0.3em] text-art-ink/60">
                <a href="#gallery" class="hover:text-art-accent transition-colors" x-text="t('nav-gallery')"></a>
                <a href="#commission" class="hover:text-art-accent transition-colors" x-text="t('nav-commission')"></a>
                <a href="#about" class="hover:text-art-accent transition-colors" x-text="t('nav-about')"></a>
                <a href="#contact" class="hover:text-art-accent transition-colors" x-text="t('nav-contact')"></a>
                <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="px-5 py-2.5 bg-art-ink text-white hover:bg-art-accent transition-colors rounded-full" x-text="t('nav-shop')"></a>
            </div>
            
            <button @click="toggleLang()" class="px-4 py-2 border border-art-ink/10 text-[10px] font-bold hover:bg-art-ink hover:text-white transition-all rounded-full min-w-[3rem]" x-text="lang === 'en' ? 'ع' : 'EN'"></button>
        </div>

        <div class="flex gap-4 md:hidden">
            <button @click="toggleLang()" class="px-3 py-1 border border-art-ink/10 text-[8px] font-bold rounded-full" x-text="lang === 'en' ? 'ع' : 'EN'"></button>
            <button @click="mobileMenu = !mobileMenu" class="p-2">
                <i data-lucide="menu"></i>
            </button>
        </div>
    </nav>

    <!-- MOBILE MENU -->
    <div x-show="mobileMenu" x-cloak x-transition.opacity class="fixed inset-0 z-[60] bg-art-bg flex flex-col items-center justify-center gap-12">
        <button @click="mobileMenu = false" class="absolute top-8 left-8 p-4"><i data-lucide="x"></i></button>
        <a href="#gallery" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-gallery')"></a>
        <a href="#commission" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-commission')"></a>
        <a href="#about" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-about')"></a>
        <a href="#contact" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-contact')"></a>
        <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="text-4xl serif-italic" x-text="t('nav-shop')"></a>
    </div>

    <!-- MAIN SITE VIEW -->
    <div x-show="view === 'site'">
        <!-- HERO SECTION (museum split layout) -->
        <section class="hero-split relative w-full flex items-center pt-24 pb-16 px-6 md:px-16 lg:px-24">
            <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-20 items-center">

                <!-- Text side -->
                <div class="fade-in order-2 lg:order-1" :class="lang === 'ar' ? 'text-right' : 'text-left'">
                    <div class="hero-eyebrow-line text-[10px] uppercase tracking-[0.4em] font-bold text-art-ink/50 mb-10" x-text="t('hero-tagline')"></div>
                    <h1 class="text-6xl md:text-8xl serif-italic font-medium leading-[0.95] mb-8" x-text="t('artist-name')"></h1>
                    <p class="text-lg md:text-xl font-light opacity-70 mb-12" x-text="t('artist-subtitle')"></p>
                    <a href="#gallery" class="inline-flex items-center gap-3 px-8 py-4 border border-art-ink/15 text-[10px] uppercase font-bold tracking-[0.3em] hover:bg-art-ink hover:text-white transition-all">
                        <span x-text="t('section-gallery')"></span>
                        <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
                    </a>
                </div>

                <!-- Featured artwork side -->
                <div class="order-1 lg:order-2 fade-in" style="animation-delay: 150ms">
                    <div class="hero-frame p-3 md:p-5 max-w-md mx-auto lg:max-w-none">
                        <img src="art/24-another-world.jpg" alt="Featured Work" class="w-full h-auto shadow-sm">
                    </div>
                    <p class="text-center mt-6 text-[10px] uppercase tracking-[0.3em] font-bold text-art-ink/40" x-text="t('hero-featured-caption')"></p>
                </div>

            </div>
        </section>

        <!-- GALLERY SECTION -->
        <section id="gallery" class="py-32 px-6 md:px-16 lg:px-32">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-baseline mb-24">
                    <div class="fade-in">
                        <span class="text-[10px] uppercase font-black tracking-[0.4em] text-art-ink/40 block mb-6" x-text="t('gallery-eyebrow')"></span>
                        <h2 class="text-5xl md:text-8xl serif-italic mb-6" x-text="t('section-gallery')"></h2>
                        <div class="h-1.5 w-32 bg-art-accent"></div>
                    </div>
                </div>

                <div x-show="loading" class="text-center py-24 opacity-30 italic serif-italic text-xl" x-text="t('loading')"></div>
                <div x-show="!loading && galleryArtworks.length === 0" class="text-center py-24 opacity-30 italic serif-italic text-xl" x-text="t('coming-soon')"></div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-16 gap-y-32" x-show="!loading">
                    <template x-for="(art, idx) in galleryArtworks" :key="idx">
                        <div class="contents">
                        <h3 x-show="groupLabel(idx)" x-text="groupLabel(idx)" class="col-span-full text-3xl md:text-5xl serif-italic pt-8 border-t border-art-ink/10"></h3>
<div @click="openArt(art)" class="group cursor-pointer fade-in" :style="`animation-delay: ${idx * 100}ms`">
                            <div class="aspect-[4/5] bg-neutral-200 overflow-hidden relative shadow-2xl artwork-image-container">
                                <img :src="art.image" :alt="art.title" class="w-full h-full object-contain p-3">
                                <div class="absolute inset-0 bg-art-ink/10 opacity-0 group-hover:opacity-100 transition-all duration-700 flex items-center justify-center">
                                    <span class="px-8 py-3 bg-white/10 backdrop-blur-md text-white text-[10px] uppercase font-bold tracking-[0.3em] border border-white/20" x-text="t('view-piece')"></span>
                                </div>
                            </div>
                            <div class="mt-8 flex justify-between items-start gap-4">
                                <div class="max-w-[70%]">
                                    <h3 class="text-2xl serif-italic font-medium leading-none mb-3" x-text="displayTitle(art)"></h3>
                                    <p x-show="art.medium || art.year" class="text-[10px] uppercase font-black text-art-ink/30 tracking-[0.2em]" x-text="[displayMedium(art), art.year].filter(Boolean).join(' · ')"></p>
                                    <p x-show="art.dimensions" class="text-[10px] uppercase font-bold text-art-ink/40 tracking-[0.2em] mt-2" x-text="displayDimensions(art)"></p>
                                </div>
                                <div class="shrink-0" :class="lang === 'ar' ? 'text-left' : 'text-right'">
                                    <p x-show="art.price && art.status !== 'collected'" class="text-sm font-medium" x-text="displayPrice(art)"></p>
                                    <p x-show="art.status === 'available'" class="text-[9px] uppercase font-black tracking-[0.2em] text-art-accent mt-1" x-text="t('label-available')"></p>
                                    <p x-show="art.status === 'collected'" class="text-[9px] uppercase font-black tracking-[0.2em] text-art-ink/35 mt-1" x-text="t('label-collected')"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- HOW TO COLLECT -->
        <section id="collect" class="py-24 px-6 md:px-16 lg:px-32 bg-white border-y border-art-ink/5">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-16">
                    <span class="text-[10px] uppercase font-black tracking-[0.4em] text-art-ink/40 block mb-6" x-text="t('collect-eyebrow')"></span>
                    <h2 class="text-4xl md:text-6xl serif-italic" x-text="t('collect-title')"></h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-12 md:gap-8">
                    <div class="text-center px-4">
                        <div class="text-art-accent serif-italic text-5xl mb-6">01</div>
                        <h3 class="text-[11px] uppercase font-black tracking-[0.25em] mb-4" x-text="t('collect-1-title')"></h3>
                        <p class="text-sm font-light opacity-60 leading-relaxed" x-text="t('collect-1-text')"></p>
                    </div>
                    <div class="text-center px-4">
                        <div class="text-art-accent serif-italic text-5xl mb-6">02</div>
                        <h3 class="text-[11px] uppercase font-black tracking-[0.25em] mb-4" x-text="t('collect-2-title')"></h3>
                        <p class="text-sm font-light opacity-60 leading-relaxed" x-text="t('collect-2-text')"></p>
                    </div>
                    <div class="text-center px-4">
                        <div class="text-art-accent serif-italic text-5xl mb-6">03</div>
                        <h3 class="text-[11px] uppercase font-black tracking-[0.25em] mb-4" x-text="t('collect-3-title')"></h3>
                        <p class="text-sm font-light opacity-60 leading-relaxed" x-text="t('collect-3-text')"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ABOUT SECTION -->
        <section id="about" class="bg-art-ink text-[#f5f2eb] py-40 px-6 md:px-16 lg:px-32">
            <div class="max-w-4xl mx-auto text-center">
                <div class="flex flex-col justify-center">
                    <span class="text-art-accent text-[10px] uppercase font-black tracking-[0.4em] mb-12 block" x-text="t('artist-statement')"></span>
                    <img src="art/21-logo.jpg" alt="Osman Rafaat" class="w-28 h-28 rounded-full mx-auto mb-10 object-cover border border-white/20">
                    <h2 class="text-5xl md:text-8xl serif-italic mb-12 leading-tight" x-text="t('about-title')"></h2>
                    
                    <div class="space-y-8 font-light text-lg md:text-xl leading-relaxed text-white/70">
                        <p x-text="t('about-p1')"></p>
                        <p x-text="t('about-p2')"></p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-16 text-center">
                            <figure>
                                <img src="art/about-process.svg" alt="Osman Rafaat drawing in his studio" class="w-full h-auto shadow-2xl">
                                <figcaption class="text-[10px] uppercase font-bold tracking-[0.25em] text-white/40 mt-4" x-text="t('about-photo-process')"></figcaption>
                            </figure>
                            <figure>
                                <img src="art/23-about-exhibition.jpg" alt="Osman Rafaat at an exhibition opening" class="w-full h-auto shadow-2xl">
                                <figcaption class="text-[10px] uppercase font-bold tracking-[0.25em] text-white/40 mt-4" x-text="t('about-photo-exhibition')"></figcaption>
                            </figure>
                            <template x-for="(a, i) in aboutArtworks" :key="'ab'+i">
                                <figure class="md:col-span-2">
                                    <img :src="a.image" :alt="a.title" class="w-full h-auto shadow-2xl">
                                    <figcaption class="text-[10px] uppercase font-bold tracking-[0.25em] text-white/40 mt-4" x-text="displayTitle(a)"></figcaption>
                                </figure>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- COMMISSION SECTION -->
        <section id="commission" class="py-32 px-6 md:px-16 lg:px-32 border-t border-art-ink/5">
            <div class="max-w-4xl mx-auto">
                <div class="text-center mb-16">
                    <span class="text-[10px] uppercase font-black tracking-[0.4em] text-art-ink/40 block mb-6" x-text="t('commission-eyebrow')"></span>
                    <h2 class="text-4xl md:text-6xl serif-italic mb-8" x-text="t('section-commission')"></h2>
                    <p class="text-lg font-light opacity-70" x-text="t('commission-desc')"></p>
                </div>

                <form @submit.prevent="sendCommission()" class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-8 md:p-12 shadow-xl border border-art-ink/5">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-40" x-text="t('form-name')"></label>
                            <input type="text" x-model="commForm.name" required class="w-full border-b border-art-ink/10 py-3 outline-none focus:border-art-accent bg-transparent">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-40" x-text="t('form-email')"></label>
                            <input type="email" x-model="commForm.email" required class="w-full border-b border-art-ink/10 py-3 outline-none focus:border-art-accent bg-transparent">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-40" x-text="t('form-subject')"></label>
                            <input type="text" x-model="commForm.subject" required class="w-full border-b border-art-ink/10 py-3 outline-none focus:border-art-accent bg-transparent">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-40" x-text="t('form-vision')"></label>
                        <textarea x-model="commForm.vision" required class="w-full border border-art-ink/10 p-4 h-full outline-none focus:border-art-accent bg-transparent resize-none md:min-h-[200px]"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full py-5 bg-art-ink text-white text-[10px] uppercase font-black tracking-[0.3em] hover:bg-art-accent transition-all" x-text="t('form-submit')"></button>
                    </div>
                </form>
            </div>
        </section>

        <!-- FOOTER -->
        <footer id="contact" class="py-32 px-6 border-t border-art-ink/5 text-center">
            <div class="max-w-2xl mx-auto flex flex-col items-center">
                <img src="art/21-logo.jpg" alt="Logo" class="h-24 w-24 rounded-full mb-12 site-logo">
                <p class="text-[10px] uppercase font-black tracking-[0.4em] mb-12 opacity-30 italic" x-text="t('footer-copy')"></p>
                
                <div class="flex flex-col md:flex-row gap-6 w-full">
                    <a href="tel:01026933840" class="flex-1 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2">
                        01026933840
                    </a>
                    <a href="https://wa.me/201026933840" target="_blank" class="flex-1 px-8 py-5 bg-art-ink text-white text-[10px] uppercase font-bold tracking-widest hover:bg-art-accent transition-all flex items-center justify-center gap-2">
                        WhatsApp
                    </a>
                </div>
                <div class="flex flex-col md:flex-row gap-6 w-full mt-6">
                    <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="flex-1 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2" x-text="t('visit-store')"></a>
                    <a href="https://www.instagram.com/osmanrafaatosman" target="_blank" class="flex-1 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2">Instagram</a>
                </div>
                <a href="mailto:osmanrafaat05@gmail.com" class="w-full mt-6 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2">osmanrafaat05@gmail.com</a>
            </div>
        </footer>
    </div>

    <!-- ZOOM -->
    <div x-show="zoom" x-cloak class="fixed inset-0 z-[200] bg-black/95 flex items-center justify-center p-2" @click="zoom = false" style="cursor:zoom-out">
        <img :src="selectedArt?.image" :alt="displayTitle(selectedArt)" class="max-w-full max-h-full object-contain">
        <button class="absolute top-4 right-4 text-white text-3xl px-4" aria-label="Close zoom">&times;</button>
    </div>

    <!-- ARTWORK MODAL -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-backdrop" @click="closeArt()" @keydown.window.escape="zoom ? zoom = false : closeArt()" @keydown.window.arrow-right="showModal && !zoom && step(lang === 'ar' ? -1 : 1)" @keydown.window.arrow-left="showModal && !zoom && step(lang === 'ar' ? 1 : -1)"></div>
        <div class="bg-art-bg w-full max-w-6xl max-h-[90vh] overflow-y-auto relative shadow-2xl flex flex-col lg:flex-row fade-in">
            <button @click="closeArt()" aria-label="Close" class="absolute top-8 left-8 z-20 p-3 hover:bg-art-ink/5 rounded-full transition-all">
                <i data-lucide="x"></i>
            </button>
            <div class="relative lg:w-3/5 bg-neutral-200 flex items-center justify-center p-8 pb-24 md:p-12 md:pb-24 lg:p-24 lg:pb-28">
                <img :src="selectedArt?.image" :alt="displayTitle(selectedArt)" @click="zoom = true" style="cursor:zoom-in" class="max-w-full max-h-[70vh] shadow-2xl">
                <div class="absolute bottom-4 inset-x-0 flex justify-center gap-3">
                    <button @click="step(-1)" aria-label="Previous work" class="px-5 py-3 bg-white/80 hover:bg-white text-[10px] uppercase font-bold tracking-[0.2em]" x-text="lang === 'ar' ? 'السابق' : 'Prev'"></button>
                    <button @click="zoom = true" aria-label="Zoom" class="px-5 py-3 bg-white/80 hover:bg-white text-[10px] uppercase font-bold tracking-[0.2em]" x-text="lang === 'ar' ? 'تكبير' : 'Zoom'"></button>
                    <button @click="step(1)" aria-label="Next work" class="px-5 py-3 bg-white/80 hover:bg-white text-[10px] uppercase font-bold tracking-[0.2em]" x-text="lang === 'ar' ? 'التالي' : 'Next'"></button>
                </div>
            </div>
            <div class="lg:w-2/5 p-12 md:p-20 flex flex-col" :class="lang === 'ar' ? 'text-right' : ''">
                <div class="flex-1">
                    <h3 class="text-4xl md:text-6xl serif-italic mb-4" x-text="displayTitle(selectedArt)"></h3>
                    <p x-show="selectedArt?.status === 'available'" class="text-[10px] uppercase font-black tracking-[0.3em] text-art-accent mb-8" x-text="t('modal-status')"></p>
                    <p x-show="selectedArt?.status === 'collected'" class="text-[10px] uppercase font-black tracking-[0.3em] text-art-ink/40 mb-8" x-text="t('modal-status-collected')"></p>
                    <div x-show="selectedArt?.description" class="p-6 bg-art-ink/5 italic serif-italic text-lg mb-12 border-l-4 border-art-accent">

                    <div class="space-y-6 pt-12 border-t border-art-ink/10 text-[10px] uppercase font-bold tracking-[0.2em] opacity-80">
                        <div class="flex justify-between border-b border-art-ink/5 pb-4" x-show="selectedArt?.dimensions">

                        <div class="flex justify-between border-b border-art-ink/5 pb-4" x-show="selectedArt?.price && selectedArt?.status !== 'collected'">

                    <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="block w-full mt-4 border border-art-ink/20 py-5 text-[10px] uppercase font-black tracking-[0.3em] text-center hover:bg-art-ink hover:text-white transition-all" x-text="t('buy-saatchi')"></a>

    <script>

                'hero-tagline': "لوحات ورسومات", 'artist-name': 'عثمان رأفت', 'artist-subtitle': 'فنان تشكيلي · المنيا، صعيد مصر',
                'hero-quote': "لوحات ورسومات", 'hero-featured-caption': 'عمل مختار · عالم آخر',

                'form-name': 'الاسم بالكامل', 'form-email': 'البريد الإلكتروني', 'form-vision': "فكرتك", 'form-subject': 'الموضوع', 'form-submit': '✉ إرسال عبر البريد', 'send-whatsapp': 'إرسال عبر واتساب', 'buy-saatchi': "صفحتي على ساتشي آرت", 'visit-store': 'متجر ساتشي آرت',
                'footer-copy': '© 2026 عثمان رأفت · جميع الحقوق محفوظة', 'label-dims': 'الأبعاد', 'label-medium': 'الخامة', 'label-year': 'السنة', 'label-price': 'السعر',
                'label-message': 'رسالتك / استفسارك', 'message-placeholder': "حابب أسأل عن العمل ده.",
                'gallery-eyebrow': 'الأعمال', 'label-available': 'متاحة',
                'collect-eyebrow': "اقتناء الأعمال", 'collect-title': "مهتم بلوحة؟",
                'collect-1-title': "اختار العمل", 'collect-1-text': "افتح العمل عشان تشوف تفاصيله.",
                'collect-2-title': "كلمني", 'collect-2-text': "ابعتلي على واتساب واسأل عن التوفر والسعر.",
                'collect-3-title': "نتفق على التوصيل", 'collect-3-text': "بنتفق على الإطار والتوصيل قبل الشراء.",
                'commission-eyebrow': 'أعمال حسب الطلب', 'modal-status': "متاحة", 'modal-status-collected': "مُقتناة", 'label-collected': 'مُقتناة', 'about-photo-process': 'في الاستوديو', 'about-photo-exhibition': 'في افتتاح معرض'
            }
        };

        const FALLBACK_ARTWORKS = [
            { id: '1', title: 'Another World', year: '2026', medium: 'Acrylic on linen fabric', price: '17000 EGP', dimensions: '120 × 200 cm', image: 'art/24-another-world.jpg', description: "Birds and plants in acrylic on linen.", status: 'available', type: '' },
            { id: '3', title: 'Birds Symphony', year: '2026', medium: 'Mix Media Acrylic and Embroidery', price: '16500 EGP', dimensions: '100 × 100 cm', image: 'art/32-birds-symphony.jpg', description: "Acrylic painting with hand embroidery.", status: 'collected', type: '' },
            { id: '4', title: 'The Peacock', year: '2026', medium: 'Acrylic on linen fabric', price: '15000 EGP', dimensions: '100 × 100 cm', image: 'art/the-peacock.svg', description: "Peacocks in acrylic on linen.", status: 'collected', type: '' },
            { id: '5', title: 'El Falooka', year: '2026', medium: 'Acrylic on linen fabric', price: '30000 EGP', dimensions: '100 × 100 cm', image: 'art/el-falooka.svg', description: "Inspired by the Nile.", status: 'available', type: '' },
            { id: '6', title: 'Leonardo da Vinci', year: '2025', medium: 'Faber-Castell colored pencils on 500gsm paper', price: '', dimensions: '30 × 25 cm (circle 7 cm)', image: 'art/leonardo.svg', description: "Redrawn study of Leonardo da Vinci. From his Art Project series: pioneers of the art schools.", status: 'available', type: '' },
            { id: '7', title: 'Gustave Courbet II', year: '2025', medium: 'Faber-Castell colored pencils on 500gsm paper', price: '', dimensions: '30 × 25 cm (circle 7 cm)', image: 'art/courbet2.svg', description: "Pioneer of Realism, redrawn in his style. From his Art Project series.", status: 'available', type: '' },
            { id: '8', title: 'Henri Matisse', year: '2025', medium: 'Faber-Castell colored pencils on 500gsm paper', price: '', dimensions: '30 × 25 cm (circle 7 cm)', image: 'art/matisse.svg', description: "Pioneer of Fauvism, redrawn in his style. From his Art Project series.", status: 'available', type: '' },
            { id: '9', title: 'Claude Monet', year: '2025', medium: 'Faber-Castell colored pencils on 500gsm paper', price: '', dimensions: '30 × 25 cm (circle 7 cm)', image: 'art/monet.svg', description: "Pioneer of Impressionism, redrawn in his style. From his Art Project series.", status: 'available', type: '' },
            { id: '10', title: 'Gustave Courbet I', year: '2025', medium: 'Faber-Castell colored pencils on 500gsm paper', price: '', dimensions: '30 × 25 cm (circle 7 cm)', image: 'art/courbet1.svg', description: "Pioneer of Realism, redrawn in his style. From his Art Project series.", status: 'available', type: '' },
            { id: '11', title: 'Artwork (details pending)', year: '', medium: '', price: '', dimensions: '', image: 'art/untitled-6.svg', description: '', status: '', type: '' },
            { id: '12', title: 'Man with a Crow', year: '2023', medium: 'Oil on canvas', price: '', dimensions: '80 × 60 cm', image: 'art/crow.svg', description: "He added the crow while in a thinking mood.", status: '', type: '' },
            { id: '13', title: 'Artwork (details pending)', year: '', medium: '', price: '', dimensions: '', image: 'art/forest.svg', description: '', status: '', type: '' },
            { id: '14', title: 'Artwork (details pending)', year: '', medium: '', price: '', dimensions: '', image: 'art/untitled-9.svg', description: '', status: '', type: '' }
        ];

        function osmanArt() {
            return {
                lang: localStorage.getItem('osman_lang') || 'en', view: 'site', loading: true, mobileMenu: false, showModal: false, zoom: false, selectedArt: null, visitorMessage: '', artworks: [],
                get galleryArtworks() { return this.artworks.filter(art => art.type !== 'about' && art.type !== 'archive'); },
                get aboutArtworks() { return this.artworks.filter(art => art.type === 'about'); },
                commForm: { name: '', email: '', subject: '', vision: '' },
                init() { this.loadArtworks(); setTimeout(() => lucide.createIcons(), 500); },
                t(key) { return TRANSLATIONS[this.lang][key] || key; },
                displayTitle(art) {
                    if (!art) return '';
                    if (this.lang !== 'ar') return art.title;
                    const names = { '1': 'عالم آخر', '3': 'سيمفونية الطيور', '4': 'الطاووس', '5': 'الفلوكة', '6': 'ليوناردو دافنشي', '7': 'جوستاف كوربيه II', '8': 'هنري ماتيس', '9': 'كلود مونيه', '10': 'جوستاف كوربيه I', '12': 'رجل مع غراب' };
                    return names[art.id] || art.title_ar || (art.title === 'Artwork (details pending)' ? 'عمل فني (التفاصيل قريبًا)' : art.title);
                },
                groupLabel(idx) {
                    const art = this.galleryArtworks[idx], prev = this.galleryArtworks[idx - 1];
                    if (!art || !art.type || art.type === 'gallery' || (prev && prev.type === art.type)) return '';
                    const labels = { more: ['More works', 'أعمال أخرى'], drawing: ['Drawings', 'رسومات'], wall: ['Wall work', 'أعمال جدارية'], ceramics: ['Ceramics', 'خزف'] };
                    const l = labels[art.type]; return l ? l[this.lang === 'ar' ? 1 : 0] : '';
                },
                displayMedium(art) {
                    if (!art?.medium) return '';
                    if (this.lang !== 'ar') return art.medium;
                    const media = { 'Acrylic on linen fabric': 'أكريليك على قماش كتان', 'Mix Media Acrylic and Embroidery': 'أكريليك وتطريز', 'Faber-Castell on 500gsm paper': 'ألوان فابر كاستل على ورق 500 جرام', 'Faber-Castell colored pencils on 500gsm paper': 'ألوان خشبية فابر كاستل على ورق 500 جرام', 'Oil on canvas': 'ألوان زيتية على قماش' };
                    return media[art.medium] || art.medium;
                },
                displayDescription(art) {
                    if (!art) return '';
                    if (this.lang !== 'ar') return art.description;
                    const descriptions = { '1': 'طيور ونباتات بألوان الأكريليك على الكتان.', '3': 'ألوان أكريليك مع تطريز يدوي.', '4': 'طواويس بألوان الأكريليك على الكتان.', '5': 'مستوحاة من النيل.', '6': 'دراسة معاد رسمها لليوناردو دافنشي. من سلسلة Art Project: رواد المدارس الفنية.', '7': 'رائد المدرسة الواقعية، أعاد رسمه بأسلوبه. من سلسلة Art Project.', '8': 'رائد المدرسة الوحشية، أعاد رسمه بأسلوبه. من سلسلة Art Project.', '9': 'رائد المدرسة الانطباعية، أعاد رسمه بأسلوبه. من سلسلة Art Project.', '10': 'رائد المدرسة الواقعية، أعاد رسمه بأسلوبه. من سلسلة Art Project.', '12': 'أضاف الغراب وهو في حالة تفكير.' };
                    return descriptions[art.id] || art.description;
                },
                displayDimensions(art) { return this.lang === 'ar' ? (art?.dimensions || '').replaceAll('cm', 'سم').replace('circle', 'قطر الدائرة') : art?.dimensions; },
                displayPrice(art) { return this.lang === 'ar' ? (art?.price || '').replace('EGP', 'جنيه') : art?.price; },
                toggleLang() { this.lang = this.lang === 'en' ? 'ar' : 'en'; localStorage.setItem('osman_lang', this.lang); },
                async loadArtworks() {
                    this.loading = true;
                    try {
                        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSiChHx_Y9xUhLWb42AXOVrqUMVSUa-G01laFnTo3IZgE2HLPnUSmpHiZhBy79rluBUyYvshSuCDreI/pub?output=csv';
                        const response = await fetch(SHEET_URL);
                        const text = await response.text();
                        this.artworks = this.parseCSV(text); const m = location.hash.match(/^#work-(\d+)$/); if (m) { const a = this.artworks.find(x => x.id === m[1]); if (a) setTimeout(() => this.openArt(a), 0); }
                    } catch (e) { console.error('Load artworks failed', e); this.artworks = FALLBACK_ARTWORKS; }
                    this.loading = false;
                },
                parseCSV(text) {
                    const LOGO_URL = 'art/21-logo.jpg';
                    const rows = [];
                    let result = [];
                    let cell = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < text.length; i++) {
                        const char = text[i];
                        const nextChar = text[i + 1];
                        
                        if (char === '"' && inQuotes && nextChar === '"') {
                            cell += '"';
                            i++;
                        } else if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            result.push(cell.trim());
                            cell = '';
                        } else if ((char === '\n' || char === '\r') && !inQuotes) {
                            if (cell !== '' || result.length > 0) {
                                result.push(cell.trim());
                                rows.push(result);
                                result = [];
                                cell = '';
                            }
                            if (char === '\r' && nextChar === '\n') i++;
                        } else {
                            cell += char;
                        }
                    }
                    if (result.length > 0 || cell !== '') {
                        result.push(cell.trim());
                        rows.push(result);
                    }

                    const header = rows[0].map(h => (h || '').toLowerCase().trim());
                    const col = name => header.indexOf(name);
                    const get = (r, name) => { const i = col(name); return i === -1 ? '' : (r[i] || ''); };
                    return rows.slice(1).map(result => {
                        if (result.length < 7) return null;
                        const art = {
                            id: get(result, 'id'),
                            title: get(result, 'title'),
                            year: get(result, 'year'),
                            medium: get(result, 'medium'),
                            price: get(result, 'price'),
                            dimensions: get(result, 'dimensions'),
                            image: get(result, 'image'),
                            description: get(result, 'description'),
                            status: get(result, 'status').toLowerCase().trim(),
                            type: get(result, 'type').toLowerCase().trim(),
                            title_ar: get(result, 'title_ar')
                        };
                        if (art.image === LOGO_URL) return null;
                        return art;
                    }).filter(Boolean);
                },
                closeArt() { this.showModal = false; this.zoom = false; if (location.hash.startsWith('#work-')) try { history.replaceState(null, '', location.pathname); } catch (e) {} },
                step(d) { const l = this.galleryArtworks; if (!l.length) return; const i = l.indexOf(this.selectedArt); this.selectedArt = l[(i + d + l.length) % l.length]; this.visitorMessage = ''; try { history.replaceState(null, '', '#work-' + this.selectedArt.id); } catch (e) {} },
                openArt(art) { this.selectedArt = art; try { history.replaceState(null, '', '#work-' + art.id); } catch (e) {} this.visitorMessage = ''; this.showModal = true; setTimeout(() => lucide.createIcons(), 50); },
                sendArtInquiry() {
                    const lines = [`مرحباً عثمان، أنا مهتم بعملك الفني: ${this.selectedArt.title}`];
                    if (this.selectedArt.dimensions) lines.push(`الأبعاد: ${this.selectedArt.dimensions}`);
                    if (this.selectedArt.price) lines.push(`السعر: ${this.selectedArt.price}`);
                    if (this.selectedArt.medium) lines.push(`الخامة: ${this.selectedArt.medium}`);
                    const text = lines.join('\n') + `\n\nرسالة من الزائر: ${this.visitorMessage}`;
                    window.open(`https://wa.me/201026933840?text=${encodeURIComponent(text)}`, '_blank');
                },
                sendCommission() {
                    window.location.href = `mailto:osmanrafaat05@gmail.com?subject=${encodeURIComponent(this.commForm.subject)}&body=${encodeURIComponent(`الاسم: ${this.commForm.name}\n${this.commForm.vision}`)}`;
                    this.commForm = { name: '', email: '', subject: '', vision: '' };
                }
            }
        }
    </script>
