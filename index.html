<!DOCTYPE html>
<html :lang="lang" :dir="lang === 'ar' ? 'rtl' : 'ltr'" x-data="osmanArt()">
<head>
    <meta charset="UTF-8">
<link rel="icon" href="art/21-logo.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osman Rafaat | Visual Artist</title>
    <meta name="description" content="Paintings and drawings by Osman Rafaat, a visual artist from Minya, Egypt. Browse the works and ask about availability.">
    <meta property="og:title" content="Osman Rafaat | Visual Artist">
    <meta property="og:description" content="Paintings and drawings by Osman Rafaat. Browse the works and contact the artist.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://osmanrafaat.github.io/osman-fine-art/">
    <meta property="og:image" content="https://osmanrafaat.github.io/osman-fine-art/art/24-another-world.jpg">
    <meta name="twitter:card" content="summary_large_image">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-57P5FH8434"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-57P5FH8434');
</script>
    
    <!-- Scripts -->
    
    
    <link rel="stylesheet" href="assets/portfolio.css">
    <script src="assets/catalog.js" defer></script>
    <script src="assets/portfolio.js" defer></script>
    <script src="https://unpkg.com/alpinejs@3.17.5/dist/cdn.min.js" defer></script>
    

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>

    
</head>
<body class="antialiased">
    <a href="#gallery" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[300] focus:bg-white focus:px-4 focus:py-2">Skip to works</a>

    <!-- NAVIGATION -->
    <nav class="fixed top-0 left-0 w-full h-24 z-50 flex items-center justify-between px-6 md:px-16 bg-art-bg/90 backdrop-blur-sm border-b border-art-ink/5">
        <a href="#" @click.prevent="window.scrollTo(0, 0)" class="h-14">
            <img width="100" height="100" src="art/21-logo.jpg" alt="Logo" class="h-full w-auto rounded-full site-logo shadow-sm border border-art-ink/10">
        </a>
        
        <div class="hidden md:flex gap-12 items-center">
            <div class="flex gap-12 text-[10px] uppercase font-bold tracking-[0.3em] text-art-ink/75">
                <a href="#gallery" class="hover:text-art-accent transition-colors" x-text="t('nav-gallery')"></a>
                <a href="#commission" class="hover:text-art-accent transition-colors" x-text="t('nav-commission')"></a>
                <a href="about/" class="hover:text-art-accent transition-colors" x-text="t('nav-about')"></a>
                <a href="#contact" class="hover:text-art-accent transition-colors" x-text="t('nav-contact')"></a>
                <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="px-5 py-2.5 bg-art-ink text-white hover:bg-art-accent transition-colors rounded-full" x-text="t('nav-shop')"></a>
            </div>
            
            <button @click="toggleLang()" class="px-4 py-2 border border-art-ink/10 text-[10px] font-bold hover:bg-art-ink hover:text-white transition-all rounded-full min-w-[3rem]" x-text="lang === 'en' ? 'ع' : 'EN'"></button>
        </div>

        <div class="flex gap-4 md:hidden">
            <button @click="toggleLang()" class="px-3 py-1 border border-art-ink/10 text-[8px] font-bold rounded-full" x-text="lang === 'en' ? 'ع' : 'EN'"></button>
            <button aria-label="Open menu" :aria-expanded="mobileMenu" @click="mobileMenu = !mobileMenu" class="p-2">
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </nav>

    <!-- MOBILE MENU -->
    <div x-show="mobileMenu" x-cloak x-transition.opacity class="fixed inset-0 z-[60] bg-art-bg flex flex-col items-center justify-center gap-12">
        <button aria-label="Close menu" @click="mobileMenu = false" class="absolute top-8 left-8 p-4"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
        <a href="#gallery" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-gallery')"></a>
        <a href="#commission" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-commission')"></a>
        <a href="about/" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-about')"></a>
        <a href="#contact" @click="mobileMenu = false" class="text-4xl serif-italic" x-text="t('nav-contact')"></a>
        <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="text-4xl serif-italic" x-text="t('nav-shop')"></a>
    </div>

    <!-- MAIN SITE VIEW -->
    <main id="main" x-show="view === 'site'">
        <!-- HERO SECTION (museum split layout) -->
        <section class="hero-split relative w-full flex items-center pt-24 pb-16 px-6 md:px-16 lg:px-24">
            <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-20 items-center">

                <!-- Text side -->
                <div class="fade-in order-2 lg:order-1" :class="lang === 'ar' ? 'text-right' : 'text-left'">
                    <div class="hero-eyebrow-line text-[10px] uppercase tracking-[0.4em] font-bold text-art-ink/75 mb-10" x-text="t('hero-tagline')"></div>
                    <h1 class="text-6xl md:text-8xl serif-italic font-medium leading-[0.95] mb-8" x-text="t('artist-name')"></h1>
                    <p class="text-lg md:text-xl font-light opacity-70 mb-12" x-text="t('artist-subtitle')"></p>
                    <a href="#gallery" class="inline-flex items-center gap-3 px-8 py-4 border border-art-ink/15 text-[10px] uppercase font-bold tracking-[0.3em] hover:bg-art-ink hover:text-white transition-all">
                        <span x-text="t('section-gallery')"></span>
                        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><path d="M12 4v16m-6-6 6 6 6-6"/></svg>
                    </a>
                </div>

                <!-- Featured artwork side -->
                <div class="order-1 lg:order-2 fade-in" style="animation-delay: 150ms">
                    <div class="hero-frame p-3 md:p-5 max-w-md mx-auto lg:max-w-none">
                        <picture><img src="originals/cover-original.jpg" width="960" height="1280" alt="Osman Rafaat standing with his painting of a veiled woman holding a jar" fetchpriority="high" class="w-full h-auto shadow-sm"></picture>
                    </div>
                </div>

            </div>
        </section>

        <!-- STATEMENT + LATEST -->
        <section id="intro" class="py-14 md:py-24 px-6 md:px-16 lg:px-32 border-y border-art-ink/5 bg-white" x-show="!loading">
            <div class="max-w-5xl mx-auto text-center">
                <p class="text-2xl md:text-4xl serif-italic leading-snug mb-4" x-text="t('about-p1')"></p>
                <p class="text-base md:text-lg font-light opacity-70 max-w-2xl mx-auto" x-text="t('about-p2')"></p>
            </div>
            <div class="max-w-6xl mx-auto mt-12" x-show="latestWorks.length">
                <h2 class="text-[10px] uppercase font-black tracking-[0.4em] text-art-ink/75 mb-6 text-center" x-text="lang === 'ar' ? 'أحدث الأعمال' : 'Latest works'"></h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8">
                    <template x-for="a in latestWorks" :key="'lt'+a.id">
                        <a :href="'#work-' + a.id" @click.prevent="openArt(a)" class="block bg-neutral-200 aspect-[4/5] p-2" :aria-label="displayTitle(a)">
                            <img :width="imageSize(a).w" :height="imageSize(a).h" :src="thumb(a)" :alt="displayTitle(a)" loading="lazy" decoding="async" class="w-full h-full object-contain">
                        </a>
                    </template>
                </div>
            </div>
        </section>

        <section x-show="featuredWorks.length" class="py-14 px-6" aria-label="Featured works"><h2 class="text-3xl text-center" x-text="lang==='ar'?'أعمال مختارة':'Featured works'"></h2><div class="portfolio-featured"><template x-for="a in featuredWorks" :key="a.id"><a :href="pageUrl(a) || '#gallery'"><img :src="thumb(a)" :alt="displayTitle(a)" loading="lazy" :width="imageSize(a).w" :height="imageSize(a).h"></a></template></div></section>
        <!-- GALLERY SECTION -->
        <section id="gallery" class="py-16 md:py-32 px-6 md:px-16 lg:px-32">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-baseline mb-10 md:mb-24">
                    <div class="fade-in">
                        <span class="text-[10px] uppercase font-black tracking-[0.4em] text-art-ink/75 block mb-6" x-text="t('gallery-eyebrow')"></span>
                        <h2 class="text-5xl md:text-8xl serif-italic mb-6" x-text="t('section-gallery')"></h2>
                        <div class="h-1.5 w-32 bg-art-accent"></div>
                    </div>
                </div>

                <div x-show="loading" class="text-center py-24 opacity-30 italic serif-italic text-xl" x-text="t('loading')"></div>
                <div x-show="!loading && galleryArtworks.length === 0" class="text-center py-24 opacity-30 italic serif-italic text-xl" x-text="t('coming-soon')"></div>

                <div class="portfolio-filters" role="group" :aria-label="lang === 'ar' ? 'تصفية الأعمال' : 'Filter works'">
                    <template x-for="k in ['all', ...categories]" :key="k"><button type="button" @click="filterType=k" :aria-pressed="filterType===k" x-text="categoryName(k)"></button></template>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-16 gap-y-14 md:gap-y-32" x-show="!loading">
                    <template x-for="(art, idx) in visibleArtworks" :key="idx">
                        <div class="contents">
                        <h3 x-show="groupLabel(idx)" x-text="groupLabel(idx)" class="col-span-full text-3xl md:text-5xl serif-italic pt-6 md:pt-8 border-t border-art-ink/10 mt-4 md:mt-0"></h3>
<div @click="openArt(art)" class="group cursor-pointer fade-in" :style="`animation-delay: ${Math.min(idx, 4) * 80}ms`">
                            <div class="aspect-[4/5] bg-neutral-200 overflow-hidden relative shadow-2xl artwork-image-container">
                                <img :width="imageSize(art).w" :height="imageSize(art).h" :src="thumb(art)" :alt="displayTitle(art)" loading="lazy" decoding="async" class="w-full h-full object-contain p-3">
                                <div class="absolute inset-0 bg-art-ink/10 opacity-0 group-hover:opacity-100 transition-all duration-700 flex items-center justify-center">
                                    <span class="px-8 py-3 bg-white/10 backdrop-blur-md text-white text-[10px] uppercase font-bold tracking-[0.3em] border border-white/20" x-text="t('view-piece')"></span>
                                </div>
                            </div>
                            <div class="mt-8 flex justify-between items-start gap-4">
                                <div class="max-w-[70%]">
                                    <h3 class="text-2xl serif-italic font-medium leading-none mb-3" x-text="displayTitle(art)"></h3>
                                    <a x-show="pageUrl(art)" :href="pageUrl(art)" @click.stop class="inline-block text-[9px] uppercase font-black tracking-[0.2em] text-art-accent mb-2 underline" x-text="lang === 'ar' ? 'صفحة العمل' : 'Work page'"></a>
                                    <p x-show="art.medium || art.year" class="text-[10px] uppercase font-black text-art-ink/75 tracking-[0.2em]" x-text="[displayMedium(art), art.year].filter(Boolean).join(' · ')"></p>
                                    <p x-show="art.dimensions" class="text-[10px] uppercase font-bold text-art-ink/75 tracking-[0.2em] mt-2" x-text="displayDimensions(art)"></p>
                                </div>
                                <div class="shrink-0" :class="lang === 'ar' ? 'text-left' : 'text-right'">
                                    <p x-show="art.price && art.status !== 'collected'" class="text-sm font-medium" x-text="displayPrice(art)"></p>
                                    <p x-show="art.status === 'available'" class="text-[9px] uppercase font-black tracking-[0.2em] text-art-accent mt-1" x-text="t('label-available')"></p>
                                    <p x-show="art.status === 'collected'" class="text-[9px] uppercase font-black tracking-[0.2em] text-art-ink/75 mt-1" x-text="t('label-collected')"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- HOW TO COLLECT -->
        <section id="collect" class="py-14 md:py-24 px-6 md:px-16 lg:px-32 bg-white border-y border-art-ink/5">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-16">
                    <span class="text-[10px] uppercase font-black tracking-[0.4em] text-art-ink/75 block mb-6" x-text="t('collect-eyebrow')"></span>
                    <h2 class="text-4xl md:text-6xl serif-italic" x-text="t('collect-title')"></h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-12 md:gap-8">
                    <div class="text-center px-4">
                        <div class="text-art-accent serif-italic text-5xl mb-6">01</div>
                        <h3 class="text-[11px] uppercase font-black tracking-[0.25em] mb-4" x-text="t('collect-1-title')"></h3>
                        <p class="text-sm font-light opacity-60 leading-relaxed" x-text="t('collect-1-text')"></p>
                    </div>
                    <div class="text-center px-4">
                        <div class="text-art-accent serif-italic text-5xl mb-6">02</div>
                        <h3 class="text-[11px] uppercase font-black tracking-[0.25em] mb-4" x-text="t('collect-2-title')"></h3>
                        <p class="text-sm font-light opacity-60 leading-relaxed" x-text="t('collect-2-text')"></p>
                    </div>
                    <div class="text-center px-4">
                        <div class="text-art-accent serif-italic text-5xl mb-6">03</div>
                        <h3 class="text-[11px] uppercase font-black tracking-[0.25em] mb-4" x-text="t('collect-3-title')"></h3>
                        <p class="text-sm font-light opacity-60 leading-relaxed" x-text="t('collect-3-text')"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ABOUT SECTION -->
        <section id="about" class="bg-art-ink text-[#f5f2eb] py-20 md:py-40 px-6 md:px-16 lg:px-32">
            <div class="max-w-4xl mx-auto text-center">
                <div class="flex flex-col justify-center">
                    <span class="text-art-accent text-[10px] uppercase font-black tracking-[0.4em] mb-12 block" x-text="t('artist-statement')"></span>
                    <img width="100" height="100" src="art/21-logo.jpg" alt="Osman Rafaat" class="w-28 h-28 rounded-full mx-auto mb-10 object-cover border border-white/20">
                    <h2 class="text-5xl md:text-8xl serif-italic mb-12 leading-tight" x-text="t('about-title')"></h2>
                    
                    <div class="space-y-8 font-light text-lg md:text-xl leading-relaxed text-white/70">
                        <p x-text="t('about-p1')"></p>
                        <p x-text="t('about-p2')"></p>
                        <p x-text="t('about-p3')"></p>
                        <p x-text="t('about-p4')"></p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-16 text-center">
                            <figure>
                                <img width="750" height="1000" loading="lazy" src="art/about-process.svg" alt="Osman Rafaat drawing in his studio" class="w-full h-auto shadow-2xl">
                                <figcaption class="text-[10px] uppercase font-bold tracking-[0.25em] text-white/75 mt-4" x-text="t('about-photo-process')"></figcaption>
                            </figure>
                            <figure>
                                <img width="960" height="720" loading="lazy" src="art/23-about-exhibition.jpg" alt="Osman Rafaat at an exhibition opening" class="w-full h-auto shadow-2xl">
                                <figcaption class="text-[10px] uppercase font-bold tracking-[0.25em] text-white/75 mt-4" x-text="t('about-photo-exhibition')"></figcaption>
                            </figure>
                            <template x-for="(a, i) in aboutArtworks" :key="'ab'+i">
                                <figure class="md:col-span-2">
                                    <img :width="imageSize(a).w" :height="imageSize(a).h" :src="a.image" :alt="displayTitle(a)" loading="lazy" class="w-full h-auto shadow-2xl">
                                    <figcaption class="text-[10px] uppercase font-bold tracking-[0.25em] text-white/75 mt-4" x-text="displayTitle(a)"></figcaption>
                                </figure>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- COMMISSION SECTION -->
        <section id="commission" class="py-16 md:py-32 px-6 md:px-16 lg:px-32 border-t border-art-ink/5">
            <div class="max-w-4xl mx-auto">
                <div class="text-center mb-16">
                    <span class="text-[10px] uppercase font-black tracking-[0.4em] text-art-ink/75 block mb-6" x-text="t('commission-eyebrow')"></span>
                    <h2 class="text-4xl md:text-6xl serif-italic mb-8" x-text="t('section-commission')"></h2>
                    <p class="text-lg font-light opacity-70" x-text="t('commission-desc')"></p>
                </div>

                <form @submit.prevent="sendCommission()" class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-8 md:p-12 shadow-xl border border-art-ink/5">
                    <div class="space-y-6">
                        <div>
                            <label for="commission-name" class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-75" x-text="t('form-name')"></label>
                            <input type="text" id="commission-name" x-model="commForm.name" required class="w-full border-b border-art-ink/10 py-3 outline-none focus:border-art-accent bg-transparent">
                        </div>
                        <div>
                            <label for="commission-email" class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-75" x-text="t('form-email')"></label>
                            <input type="email" id="commission-email" x-model="commForm.email" required class="w-full border-b border-art-ink/10 py-3 outline-none focus:border-art-accent bg-transparent">
                        </div>
                        <div>
                            <label for="commission-subject" class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-75" x-text="t('form-subject')"></label>
                            <input type="text" id="commission-subject" x-model="commForm.subject" required class="w-full border-b border-art-ink/10 py-3 outline-none focus:border-art-accent bg-transparent">
                        </div>
                    </div>
                    <div>
                        <label for="commission-vision" class="block text-[10px] uppercase font-black tracking-widest mb-2 opacity-75" x-text="t('form-vision')"></label>
                        <textarea id="commission-vision" x-model="commForm.vision" required class="w-full border border-art-ink/10 p-4 h-full outline-none focus:border-art-accent bg-transparent resize-none md:min-h-[200px]"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full py-5 bg-art-ink text-white text-[10px] uppercase font-black tracking-[0.3em] hover:bg-art-accent transition-all" x-text="t('form-submit')"></button>
                    </div>
                </form>
            </div>
        </section>

        <!-- FOOTER -->
        <footer id="contact" class="py-16 md:py-32 px-6 border-t border-art-ink/5 text-center">
            <div class="max-w-2xl mx-auto flex flex-col items-center">
                <img width="100" height="100" src="art/21-logo.jpg" alt="Logo" class="h-24 w-24 rounded-full mb-12 site-logo">
                <p class="text-[10px] uppercase font-black tracking-[0.4em] mb-12 opacity-30 italic" x-text="t('footer-copy')"></p>
                
                <div class="flex flex-col md:flex-row gap-6 w-full">
                    <a href="tel:01026933840" class="flex-1 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2">
                        01026933840
                    </a>
                    <a href="https://wa.me/201026933840" target="_blank" class="flex-1 px-8 py-5 bg-art-ink text-white text-[10px] uppercase font-bold tracking-widest hover:bg-art-accent transition-all flex items-center justify-center gap-2">
                        WhatsApp
                    </a>
                </div>
                <div class="flex flex-col md:flex-row gap-6 w-full mt-6">
                    <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="flex-1 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2" x-text="t('visit-store')"></a>
                    <a href="https://www.instagram.com/osmanrafaatosman" target="_blank" class="flex-1 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2">Instagram</a>
                </div>
                <a href="mailto:osmanrafaat05@gmail.com" class="w-full mt-6 px-8 py-5 border border-art-ink/10 text-[10px] uppercase font-bold tracking-widest hover:bg-art-ink hover:text-white transition-all flex items-center justify-center gap-2">osmanrafaat05@gmail.com</a>
            </div>
        </footer>
    </main>

    <!-- ZOOM -->
    <div x-show="zoom" x-cloak class="fixed inset-0 z-[200] bg-black/95 flex items-center justify-center p-2" @click="zoom = false" style="cursor:zoom-out">
        <img :width="imageSize(selectedArt).w" :height="imageSize(selectedArt).h" :src="full(selectedArt)" @error="imgFallback($event)" :alt="displayTitle(selectedArt)" class="max-w-full max-h-full object-contain">
        <button class="absolute top-4 right-4 text-white text-3xl px-4" aria-label="Close zoom">&times;</button>
    </div>

    <!-- ARTWORK MODAL -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-backdrop" @click="closeArt()" @keydown.window.escape="zoom ? zoom = false : closeArt()" @keydown.window.arrow-right="showModal && !zoom && step(lang === 'ar' ? -1 : 1)" @keydown.window.arrow-left="showModal && !zoom && step(lang === 'ar' ? 1 : -1)"></div>
        <div class="bg-art-bg w-full max-w-6xl max-h-[90vh] overflow-y-auto relative shadow-2xl flex flex-col lg:flex-row fade-in">
            <button @click="closeArt()" aria-label="Close" class="absolute top-8 left-8 z-20 p-3 hover:bg-art-ink/5 rounded-full transition-all">
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M6 18 18 6"/></svg>
            </button>
            <div class="relative lg:w-3/5 bg-neutral-200 flex items-center justify-center p-8 pb-24 md:p-12 md:pb-24 lg:p-24 lg:pb-28">
                <img :width="imageSize(selectedArt).w" :height="imageSize(selectedArt).h" :src="full(selectedArt)" @error="imgFallback($event)" :alt="displayTitle(selectedArt)" @click="zoom = true" style="cursor:zoom-in" class="max-w-full max-h-[70vh] shadow-2xl">
                <div class="absolute bottom-4 inset-x-0 flex justify-center gap-3">
                    <button @click="step(-1)" aria-label="Previous work" class="px-5 py-3 bg-white/80 hover:bg-white text-[10px] uppercase font-bold tracking-[0.2em]" x-text="lang === 'ar' ? 'السابق' : 'Prev'"></button>
                    <button @click="zoom = true" aria-label="Zoom" class="px-5 py-3 bg-white/80 hover:bg-white text-[10px] uppercase font-bold tracking-[0.2em]" x-text="lang === 'ar' ? 'تكبير' : 'Zoom'"></button>
                    <button @click="step(1)" aria-label="Next work" class="px-5 py-3 bg-white/80 hover:bg-white text-[10px] uppercase font-bold tracking-[0.2em]" x-text="lang === 'ar' ? 'التالي' : 'Next'"></button>
                </div>
            </div>
            <div class="lg:w-2/5 p-12 md:p-20 flex flex-col" :class="lang === 'ar' ? 'text-right' : ''">
                <div class="flex-1">
                    <h3 class="text-4xl md:text-6xl serif-italic mb-4" x-text="displayTitle(selectedArt)"></h3>
                    <p x-show="selectedArt?.status === 'available'" class="text-[10px] uppercase font-black tracking-[0.3em] text-art-accent mb-8" x-text="t('modal-status')"></p>
                    <p x-show="selectedArt?.status === 'collected'" class="text-[10px] uppercase font-black tracking-[0.3em] text-art-ink/75 mb-8" x-text="t('modal-status-collected')"></p>
                    <div x-show="selectedArt?.description" class="p-6 bg-art-ink/5 italic serif-italic text-lg mb-12 border-l-4 border-art-accent">
                        <p x-text="displayDescription(selectedArt)"></p>
                    </div>
                    <div class="space-y-6 pt-12 border-t border-art-ink/10 text-[10px] uppercase font-bold tracking-[0.2em] opacity-80">
                        <div class="flex justify-between border-b border-art-ink/5 pb-4" x-show="selectedArt?.dimensions">
                            <span class="opacity-75" x-text="t('label-dims')"></span>
                            <span x-text="displayDimensions(selectedArt)"></span>
                        </div>
                        <div class="flex justify-between border-b border-art-ink/5 pb-4" x-show="selectedArt?.price && selectedArt?.status !== 'collected'">
                            <span class="opacity-75" x-text="t('label-price')"></span>
                            <span x-text="displayPrice(selectedArt)"></span>
                        </div>
                        <div class="flex justify-between border-b border-art-ink/5 pb-4" x-show="selectedArt?.medium">
                            <span class="opacity-75" x-text="t('label-medium')"></span>
                            <span x-text="displayMedium(selectedArt)"></span>
                        </div>
                        <div class="flex justify-between border-b border-art-ink/5 pb-4" x-show="selectedArt?.year">
                            <span class="opacity-75" x-text="t('label-year')"></span>
                            <span x-text="selectedArt?.year"></span>
                        </div>
                    </div>
                    <div class="mt-12 space-y-4">
                        <label class="block text-[10px] uppercase font-black tracking-widest opacity-75 mb-2" x-text="t('label-message')"></label>
                        <textarea aria-label="Your message" x-model="visitorMessage" :placeholder="t('message-placeholder')" class="w-full p-4 bg-white border border-art-ink/10 text-sm outline-none focus:border-art-accent min-h-[100px] resize-none"></textarea>
                    </div>
                </div>
                <div class="mt-12">
                    <button @click="sendArtInquiry()" class="block w-full bg-art-ink text-white py-5 text-[10px] uppercase font-black tracking-[0.3em] text-center hover:bg-art-accent transition-all" x-text="t('send-whatsapp')"></button>
                    <a href="https://www.saatchiart.com/osmanrafaatosman" target="_blank" class="block w-full mt-4 border border-art-ink/20 py-5 text-[10px] uppercase font-black tracking-[0.3em] text-center hover:bg-art-ink hover:text-white transition-all" x-text="t('buy-saatchi')"></a>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
